unbind C-b
set -g prefix C-Space
bind -N "Send the prefix key to the program inside" C-Space send-prefix

# Terminal: ghostty sets TERM=xterm-256color; advertise truecolor so nvim keeps its palette
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,ghostty:RGB,alacritty:RGB"
set -s terminal-features[10] "xterm-256color:RGB:usstyle:hyperlinks:strikethrough:overline:sync"
set -s terminal-features[11] "xterm-ghostty:RGB:usstyle:hyperlinks:strikethrough:overline:sync"
set -g default-shell /usr/bin/zsh

set -s extended-keys on
set -g allow-passthrough on          # OSC52 clipboard from nvim
set -g set-clipboard off

set -sg escape-time 10               # snappy <Esc> in nvim
set -g repeat-time 300
set -g focus-events on               # nvim autoread
set -g history-limit 20000           # per pane
set -g mouse on

# Windows and panes numbered from 1, renumbered on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#W"
setw -g automatic-rename on
set -g status-interval 2

# Vi copy mode; y, mouse drag and double/triple click all copy to the Wayland clipboard
setw -g mode-keys vi
set -s copy-command "wl-copy"
bind -N "Copy mode (vi)" Escape copy-mode
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Select the line" -T copy-mode-vi V send -X select-line
bind -N "Toggle rectangle selection" -T copy-mode-vi C-v send -X rectangle-toggle
bind -N "Copy to the Wayland clipboard and leave" -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -N "Leave copy mode" -T copy-mode-vi Escape send -X cancel

# Mouse: drag, double click (word) and triple click (line) copy to the clipboard through copy-command
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel
# outside copy mode: an app that grabs the mouse (nvim, lazygit) gets the click, otherwise enter copy mode and copy
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send -X select-word ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel }
bind -n TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send -X select-line ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel }

# Bell from a background window is flagged in the window list
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off


# A terminal window owns its term-* session (SUPER+Return): closing the ghostty window destroys it with everything in it.
# No `-t`: in a hook the new session is the current target, while tmux does not expand formats in `-t` (the old
# `-t "#{session_name}"` matched no session, so the option was never set). doctor checks it in a private server.
set-hook -g session-created 'if-shell -F "#{m:term-*,#{session_name}}" "set-option destroy-unattached on"'

# lazygit colours (merged after its structural config by LG_CONFIG_FILE; only when the theme ships the file)
run-shell 'if [ -r "$HOME/.local/state/theme/current/lazygit.yml" ]; then tmux set-environment -g LG_CONFIG_FILE "$HOME/.config/lazygit/config.yml,$HOME/.local/state/theme/current/lazygit.yml"; fi'

# Splits and new windows keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# vim-tmux-navigator: Ctrl+h/j/k/l move between tmux panes and pass through to nvim splits and fzf
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -N "Move to the pane on the left (passes through to nvim)" -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -N "Move to the pane below (passes through to nvim)" -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -N "Move to the pane above (passes through to nvim)" -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -N "Move to the pane on the right (passes through to nvim)" -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Window switching without the prefix: Alt+h/l previous/next, Alt+Space last, Alt+1..9 jump, Alt+Shift+h/l move
bind -N "Previous window" -n M-h previous-window
bind -N "Next window" -n M-l next-window
bind -N "Last window" -n M-Space last-window
bind -N "Last window" Tab last-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -N "Move the window left" -n M-H swap-window -t -1 \; select-window -t -1
bind -N "Move the window right" -n M-L swap-window -t +1 \; select-window -t +1

# App windows; detach moves from d to D
bind -N "New window running lazygit" g new-window -n lazygit -c "#{pane_current_path}" lazygit
bind -N "New window running lazydocker" d new-window -n lazydocker -c "#{pane_current_path}" lazydocker
bind -N "New window running yazi" y new-window -n yazi -c "#{pane_current_path}" yazi
bind -N "Detach" D detach-client

# Popups
bind -N "Popup shell in the pane's directory" '`' display-popup -E -d "#{pane_current_path}" -w 80% -h 70%
bind -N "URL picker from the scrollback (Enter opens, Ctrl-y copies)" u display-popup -E -w 80% -h 60% "~/.config/tmux/scripts/url-picker.sh '#{pane_id}'"

# Sessions
bind -N "New named session (name is mandatory and unique)" C command-prompt -p "new session name:" "run-shell '~/.config/tmux/scripts/new-session.sh \"%1\" || true'"
bind -N "Kill-session picker" X display-popup -w 85% -h 70% -E "bash ~/.config/tmux/scripts/kill-session.sh"
bind -N "Kill-session picker" C-x display-popup -w 85% -h 70% -E "bash ~/.config/tmux/scripts/kill-session.sh"
bind -N "Kill the current session (confirm) and land in a fresh one" Q confirm-before -p "kill session '#S'? (y/n)" {
  run-shell "bash ~/.config/tmux/scripts/kill-and-new.sh '#{session_name}' '#{pane_current_path}'"
}

# Status bar: ANSI palette indexes, so colors follow the active ghostty theme
set -g status-position top
set -g status-justify absolute-centre   # window list centered on full bar width (ignores left/right asymmetry)
set -g status-style "bg=default,fg=colour7"
# badges: PREFIX yellow, COPY blue, ZOOM magenta, SYNC red; then the session name
set -g status-left "#{?client_prefix,#[fg=colour0]#[bg=colour3]#[bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=colour0]#[bg=colour4]#[bold] COPY #[default] ,}#{?window_zoomed_flag,#[fg=colour5]#[bold]󰁌 ZOOM #[default] ,}#[fg=colour4,bold]#S "
set -g status-left-length 50
set -g status-right "#{?pane_synchronized,#[fg=colour1]#[bold]SYNC #[default],}#[fg=colour8]%H:%M "
set -g status-right-length 60
set -g window-status-separator ""
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-activity-style default
set -g window-status-bell-style default
setw -g window-status-format "#[fg=colour8] #I:#W#{?window_bell_flag,#[fg=colour1] 󰂞,} "
setw -g window-status-current-format "#[fg=colour2,bold] #I:#W#{?window_zoomed_flag,#[fg=colour5] 󰁌,} "
set -g message-style "bg=default,fg=colour3"

# Pane borders
set -g pane-border-lines single
set -g pane-border-indicators arrows
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g popup-border-lines rounded
set -g menu-border-lines rounded

# Pane titles on the top border, only in windows with 2+ panes: index, command, title when set by the app (not the hostname)
set -g pane-border-status off
set -g pane-border-format "#{?pane_active,#[fg=colour4]#[bold],#[fg=colour8]} #{pane_index} #{pane_current_command}#{?#{&&:#{pane_title},#{&&:#{!=:#{pane_title},#{host}},#{!=:#{pane_title},#{host_short}}}}, · #{=/32/…:pane_title},} "
set-hook -g after-split-window 'if-shell -F "#{>:#{window_panes},1}" "set-option -w pane-border-status top"'
set-hook -g after-kill-pane    'if-shell -F "#{==:#{window_panes},1}" "set-option -w pane-border-status off"'
set-hook -g pane-exited        'if-shell -F "#{==:#{window_panes},1}" "set-option -w pane-border-status off"'
bind T command-prompt -I "#T" -p "pane title:" { select-pane -T "%%" }

# Hints (tmux-fingers, AUR): prefix f marks URLs, paths, SHAs, IPs; the letter copies, Ctrl+letter opens,
# Shift+letter pastes, Tab multi-selects. prefix F = jump mode (prefix j stays pane-down). Until the package
# is installed prefix f stays tmux's own find-window.
set -g @fingers-key f
set -g @fingers-jump-key F
set -g @fingers-ctrl-action ':open:'
set -g @fingers-shift-action ':paste:'
set -g @fingers-hint-style 'fg=green,bold'
set -g @fingers-highlight-style 'fg=yellow'
set -g @fingers-backdrop-style 'fg=colour8'
set -g @fingers-selected-hint-style 'fg=blue,bold'
set -g @fingers-selected-highlight-style 'fg=blue'
if-shell 'command -v tmux-fingers >/dev/null 2>&1' 'run-shell "tmux-fingers load-config"'

# Plugins (TPM). Kept in ~/.tmux/plugins: ~/.config/tmux is a symlink into the dotfiles repo.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # backend of the named snapshots below
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-sidebar'     # prefix e: file tree pane, prefix E: open and focus it
set -g @sidebar-tree 'e'                       # default Tab is last-window here
set -g @sidebar-tree-focus 'E'
set -g @sidebar-tree-command 'tree -C'
set -g @sidebar-tree-width '50'

# Install TPM if missing, then load plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# Named snapshots (after TPM, so these win over resurrect's own prefix C-s / C-r):
# S saves under a unique name, R restores from an fzf list (Ctrl-d deletes), N saves and starts a new session
bind -N "Save a named snapshot" S command-prompt -p "snapshot name:" "run-shell '~/.config/tmux/scripts/snapshot-save.sh \"%1\" || true'"
bind -N "Save a named snapshot" C-s command-prompt -p "snapshot name:" "run-shell '~/.config/tmux/scripts/snapshot-save.sh \"%1\" || true'"
bind -N "Restore a snapshot (fzf, Ctrl-d deletes)" R display-popup -w 90% -h 70% -E "bash ~/.config/tmux/scripts/snapshot-restore.sh"
bind -N "Restore a snapshot (fzf, Ctrl-d deletes)" C-r display-popup -w 90% -h 70% -E "bash ~/.config/tmux/scripts/snapshot-restore.sh"
bind -N "Save the current session as a snapshot, then start a new unnamed one" N if-shell -F "#{m/r:^[0-9]+$,#{session_name}}" {
  command-prompt -p "save as:" { run-shell "bash ~/.config/tmux/scripts/save-and-new.sh '#{session_name}' '#{pane_current_path}' '%1' || true" }
} {
  run-shell "bash ~/.config/tmux/scripts/save-and-new.sh '#{session_name}' '#{pane_current_path}' || true"
}
