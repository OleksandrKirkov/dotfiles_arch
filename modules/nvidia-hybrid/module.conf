DESCRIPTION="Intel iGPU + NVIDIA dGPU laptop: drivers, suspend, Brave on Intel"
SCOPE=user
DEPENDS=(apps)
# vulkan-intel: Vulkan apps stop waking the NVIDIA GPU
PACMAN=(nvidia-utils nvidia-settings vulkan-intel)
# The driver preserves video memory across sleep only through these units;
# without them resume shows a black screen
SERVICES=(nvidia-suspend.service nvidia-resume.service nvidia-hibernate.service)
# Dynamic Boost is unsupported here (NvPcfApi is not initialized), and the
# daemon wakes the GPU on every AC/battery switch
SERVICES_DISABLE=(nvidia-powerd.service)
