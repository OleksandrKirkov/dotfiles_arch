# Tsugumori: matches waybar.css.
[global]
    frame_color = "#cc1515"
    separator_color = "#1a1814"
    highlight = "#cc1515"

[urgency_low]
    background = "#0a0a0a"
    foreground = "#a29b96"
    frame_color = "#1a1814"

[urgency_normal]
    background = "#0a0a0a"
    foreground = "#e8e8e8"
    frame_color = "#cc1515"

[urgency_critical]
    background = "#0a0a0a"
    foreground = "#e8e8e8"
    frame_color = "#9e1010"
    highlight = "#9e1010"
