monitor=,preferred,auto,auto

monitor = HDMI-A-1, 3440x1440@99.98, 0x0, 1, bitdepth, 10
# monitor = HDMI-A-1, 1920x1080@240.00, 1920x0, 1, bitdepth, 10
monitor = eDP-1, 1920x1080@120, 3440x0, 1
# monitor = eDP-1, 1920x1080@120, 0x0, 1
# monitor = eDP-1, disable

$mainMod = Super
$TERMINAL = ghostty
$EDITOR = nvim
$BROWSER = flatpak run com.brave.Browser
$fileManagerTerminal = $TERMINAL -e yazi
$fileManagerGUI = nautilus
$menu = wofi --show drun

exec-once = $TERMINAL
exec-once = $BROWSER
exec-once = 'waybar'
exec-once = 'hyprpaper'
exec-once = Telegram
exec-once = hypridle

general {
    border_size = 0
    gaps_in = 4
    gaps_out = 4
}

env = __GL_DITHERING,1
env = __GL_FORCE_10BIT,0
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GL_VRR_ALLOWED,1
env = __GL_GSYNC_ALLOWED,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = BROWSER,flatpak run com.brave.Browser
env = FILE_MANAGER,nautilus

input {
    kb_layout = us,ua
    kb_options = grp:alt_space_toggle
    follow_mouse = 1
    sensitivity = -0.1

    touchpad {
        natural_scroll = true
    }
}

animations {
    enabled = false
}

dwindle {
    # pseudotile = yes
    preserve_split = yes
}

misc {
    force_default_wallpaper = 0
    vrr = 2
}

gesture = 3, horizontal, workspace

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

cursor {
    no_hardware_cursors = true
}

bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext, prev

bind = $mainMod, Q, exec, $TERMINAL
bind = $mainMod, B, exec, $BROWSER
bind = $mainMod, W, killactive
bind = $mainMod, E, exec, $fileManagerTerminal
bind = $mainMod SHIFT, E, exec, $fileManagerGUI
bind = $mainMod, V, togglefloating
bind = $mainMod, space, exec, $menu 
bind = ALT, F, togglefloating
# bind = $mainMod, I, togglesplit
# bind = $mainMod, T, exec, telegram-desktop
# bind = $mainMod, S, exec, if pgrep -x "spotify" > /dev/null; then hyprctl dispatch focuswindow "class:Spotify"; else flatpak run com.spotify.Client; fi
bind = $mainMod, F, fullscreen
bind = $mainMod, M, exec, waybar
bind = $mainMod, N, exec, killall waybar
bind = $mainMod, T, exec, pkill -x hyprpaper; hyprpaper
bind = $mainMod, O, exec, obsidian
bind = $mainMod, D, exec, wofi --show drun

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

binde = $mainMod, left, resizeactive, -20 0
binde = $mainMod, right, resizeactive, 20 0
binde = $mainMod, up, resizeactive, 0 -20
binde = $mainMod, down, resizeactive, 0 20

binde = $mainMod SHIFT, left, resizeactive, -50 0
binde = $mainMod SHIFT, right, resizeactive, 50 0
binde = $mainMod SHIFT, up, resizeactive, 0 -50
binde = $mainMod SHIFT, down, resizeactive, 0 50

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod ALT, 1, workspace, 11
bind = $mainMod ALT, 2, workspace, 12
bind = $mainMod ALT, 3, workspace, 13
bind = $mainMod ALT, 4, workspace, 14
bind = $mainMod ALT, 5, workspace, 15
bind = $mainMod ALT, 6, workspace, 16
bind = $mainMod ALT, 7, workspace, 17
bind = $mainMod ALT, 8, workspace, 18
bind = $mainMod ALT, 9, workspace, 19
bind = $mainMod ALT, 0, workspace, 20
bind = $mainMod, TAB, workspace, prev

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT ALT, 1, movetoworkspace, 11
bind = $mainMod SHIFT ALT, 2, movetoworkspace, 12
bind = $mainMod SHIFT ALT, 3, movetoworkspace, 13
bind = $mainMod SHIFT ALT, 4, movetoworkspace, 14
bind = $mainMod SHIFT ALT, 5, movetoworkspace, 15
bind = $mainMod SHIFT ALT, 6, movetoworkspace, 16
bind = $mainMod SHIFT ALT, 7, movetoworkspace, 17
bind = $mainMod SHIFT ALT, 8, movetoworkspace, 18
bind = $mainMod SHIFT ALT, 9, movetoworkspace, 19
bind = $mainMod SHIFT ALT, 0, movetoworkspace, 20

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bindl =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl =, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel =, XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel =, XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindl =, XF86AudioNext, exec, playerctl next
bindl =, XF86AudioPause, exec, playerctl play-pause
bindl =, XF86AudioPlay, exec, playerctl play-pause
bindl =, XF86AudioPrev, exec, playerctl previous
bind = $mainMod, Escape, exec, loginctl lock-session

bind = ALT, S, exec, grim -g "$(slurp)" - | wl-copy

# bind = SHIFT ALT, S, exec, grim -g "$(slurp)" - | swappy -f -
