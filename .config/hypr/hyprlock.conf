$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = /home/oleksandr/Pictures/Wallpapers/Aleph.jpg
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(c0caf5ee)
    check_color = rgba(9ece6aee)
    fail_color = rgba(f7768eee)
    font_color = rgb(192, 202, 245)
    fade_on_empty = false
    rounding = 8
    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT[us,ua]
    font_size = 24
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 250, -20
    halign = center
    valign = center
}
