# Prefix: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal: ghostty sets TERM=xterm-256color; advertise truecolor so nvim keeps its palette
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g default-shell /usr/bin/zsh

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# Windows and panes numbered from 1, renumbered on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi copy mode, yank to the Wayland clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Splits and new windows keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Status bar: ANSI palette indexes, so colors follow the active ghostty theme
set -g status-position top
set -g status-style "bg=default,fg=colour7"
set -g status-left "#[fg=colour4,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=colour8]%H:%M "
setw -g window-status-format "#[fg=colour8] #I:#W "
setw -g window-status-current-format "#[fg=colour2,bold] #I:#W "
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=default,fg=colour3"
