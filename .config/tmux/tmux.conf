unbind C-b
set -g prefix C-Space
bind -N "Send the prefix key to the program inside" C-Space send-prefix

# Terminal: ghostty sets TERM=xterm-256color; advertise truecolor so nvim keeps its palette
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,ghostty:RGB,alacritty:RGB"
set -s terminal-features[10] "xterm-256color:RGB:usstyle:hyperlinks:strikethrough:overline:sync"
set -s terminal-features[11] "xterm-ghostty:RGB:usstyle:hyperlinks:strikethrough:overline:sync"
set -g default-shell /usr/bin/zsh

set -s extended-keys on
set -g allow-passthrough on          # OSC52 clipboard from nvim
set -g set-clipboard off

set -sg escape-time 10               # snappy <Esc> in nvim
set -g repeat-time 300
set -g focus-events on               # nvim autoread
set -g history-limit 20000           # per pane
set -g mouse on

# Windows and panes numbered from 1, renumbered on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#W"
setw -g automatic-rename on
set -g status-interval 2

# Vi copy mode; y, mouse drag and double/triple click all copy to the Wayland clipboard
setw -g mode-keys vi
set -s copy-command "wl-copy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Bell from a background window is flagged in the window list
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# lazygit colours (merged after its structural config by LG_CONFIG_FILE; only when the theme ships the file)
run-shell 'if [ -r "$HOME/.local/state/theme/current/lazygit.yml" ]; then tmux set-environment -g LG_CONFIG_FILE "$HOME/.config/lazygit/config.yml,$HOME/.local/state/theme/current/lazygit.yml"; fi'

# Splits and new windows keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Status bar: ANSI palette indexes, so colors follow the active ghostty theme
set -g status-position top
set -g status-justify absolute-centre   # window list centered on full bar width (ignores left/right asymmetry)
set -g status-style "bg=default,fg=colour7"
set -g status-left "#[fg=colour4,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=colour8]%H:%M "
set -g status-right-length 60
set -g window-status-separator ""
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-activity-style default
set -g window-status-bell-style default
setw -g window-status-format "#[fg=colour8] #I:#W "
setw -g window-status-current-format "#[fg=colour2,bold] #I:#W "
set -g message-style "bg=default,fg=colour3"

# Pane borders
set -g pane-border-lines single
set -g pane-border-indicators arrows
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g popup-border-lines rounded
set -g menu-border-lines rounded

# Pane titles on the top border, only in windows with 2+ panes: index, command, title when set by the app (not the hostname)
set -g pane-border-status off
set -g pane-border-format "#{?pane_active,#[fg=colour4]#[bold],#[fg=colour8]} #{pane_index} #{pane_current_command}#{?#{&&:#{pane_title},#{&&:#{!=:#{pane_title},#{host}},#{!=:#{pane_title},#{host_short}}}}, · #{=/32/…:pane_title},} "
set-hook -g after-split-window 'if-shell -F "#{>:#{window_panes},1}" "set-option -w pane-border-status top"'
set-hook -g after-kill-pane    'if-shell -F "#{==:#{window_panes},1}" "set-option -w pane-border-status off"'
set-hook -g pane-exited        'if-shell -F "#{==:#{window_panes},1}" "set-option -w pane-border-status off"'
bind T command-prompt -I "#T" -p "pane title:" { select-pane -T "%%" }
